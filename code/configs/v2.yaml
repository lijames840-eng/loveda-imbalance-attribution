paths:
  data: "data/raw/LoveDA"
  experiments: "experiments"

data:
  crop: 512
  workers: 8
  scale_range: [0.75, 1.5]

train:
  epochs: 30
  batch_size: 8
  accum_steps: 1
  lr: 0.0006
  weight_decay: 0.01
  seed: 42
  class_weights: null
  # dice_weight lives under train.loss only (a top-level copy is silently overridden
  # by the nested value in train.py, which has caused confusion before).
  loss:
    # V2 = per-image adaptive reweighting + Dice + boundary weighting (three-part bundle).
    # It measures the *whole* loss layer; do not attribute its gain to a single term
    # without a single-factor run.
    dice_weight: 0.5
    per_image: true
    weight_clip: [0.5, 4.0]
    # Fixed per-class factors restoring dataset-level class shares. Without them the
    # per-tile normalisation starves rare classes (barren fell to 0.60x its global
    # share). Regenerate with: python code/calibrate_share.py
    share_scale: "data/stats/per_image_share_scale.json"
    boundary_weight: 1.0
