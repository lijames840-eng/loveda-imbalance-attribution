data:
  crop: 512
  scale_range:
  - 0.75
  - 1.5
  workers: 8
model: v1
paths:
  data: data/raw/LoveDA
  experiments: experiments
train:
  accum_steps: 1
  batch_size: 8
  class_weights: null
  epochs: 30
  loss:
    boundary_weight: 0.0
    dice_weight: 0.0
    per_image: true
    share_scale: data/stats/per_image_share_scale.json
    weight_clip:
    - 0.5
    - 4.0
  lr: 0.0006
  seed: 42
  weight_decay: 0.01
