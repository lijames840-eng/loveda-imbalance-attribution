paths:
  data: "data/raw/LoveDA"
  experiments: "experiments"

data:
  crop: 512
  workers: 8
  scale_range: [0.75, 1.5]

train:
  epochs: 30
  batch_size: 8
  accum_steps: 1          # effective batch 8, fits 6 GB
  lr: 0.0006
  weight_decay: 0.01
  seed: 42
  dice_weight: 0.5
  class_weights: null     # null = plain CE; V2 will supply per-image adaptive weights
