paths:
  data: "data/raw/LoveDA"
  experiments: "experiments"

data:
  crop: 512
  workers: 8
  scale_range: [0.75, 1.5]

train:
  epochs: 30
  batch_size: 8
  accum_steps: 1
  lr: 0.0006
  weight_decay: 0.01
  seed: 42
  class_weights: null
  # V5 = V2's loss (unchanged) + the bottleneck context module replaced by ASPP-Lite.
  # Keep this block IDENTICAL to configs/v2.yaml: the only variable is the architecture,
  # so V5 - V2 is attributable to "how context is aggregated" and nothing else.
  loss:
    dice_weight: 0.5
    per_image: true
    weight_clip: [0.5, 4.0]
    share_scale: "data/stats/per_image_share_scale.json"
    boundary_weight: 1.0
